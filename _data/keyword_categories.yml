# Maps every keyword/tag string used on the site (publications + projects) to one
# of 5 color categories, so topic tags read as an organized taxonomy rather than
# a wall of identical blue chips. See _includes/widgets/keyword_tags.html and
# project_item.html for where this is consumed, and assets/css/global.css
# (search "tag-video") for the palette itself.
#
# The 5 categories and their render order (fixed, for CVD-safety — see the
# comment above .tag-video in global.css): video, vision, learning, mllm, systems.
#
# Unmapped tags fall back to "video" (the site's primary/default hue). If you add
# a new keyword, add it here — otherwise it silently renders as that default.

