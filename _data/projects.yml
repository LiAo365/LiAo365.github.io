projects:
- title: "Multimodal Agent System: Long-Video Understanding & AIGC Content Detection"
  title_zh: "多模态 Agent 系统：长视频理解与 AIGC 内容检测"
  role: Module Lead — Video Synthesis & Video Understanding
  role_zh: 子模块负责人 — 负责视频数据合成与视频理解模块
  date: Oct. 2025 - Aug. 2026
  date_zh: 2025.10 - 2026.08
  tags: [Multimodal LLM, Agent System, Long-Video Understanding]
  tech_stack: [LangGraph, Qwen-VL + vLLM, Function Calling / MCP, Context Engineering, Agentic Harness]
  highlights:
  - "Owned the forged-video synthesis module. Iterated the pipeline through three stages: (1) refactored the hard-coded workflow into a standardized tool suite with broader forgery types; (2) upgraded to an agent system with fixed orchestration, using tool calls + agent evaluation to freely compose forgery modes; (3) evolved into an <strong>agentic harness</strong> that learns new forgery strategies from human-feedback samples and distills them into reusable skills — covering long-tail cases that preset pipelines miss. Deception rate against the deployed detector: <strong>13% → 48%</strong>."
  - "Owned the long-video understanding module. Hour-long videos blow past the MLLM context window, so I built a perception–analysis–decision multi-agent architecture that wraps segmentation, tracking, and temporal forensics as tools dispatched via Function Calling / MCP. A three-level hierarchy (global summary → candidate-segment recall → in-segment localization) gives segment-level grounding with a traceable evidence chain. Temporal IoU: <strong>54% → 72%</strong>."
  highlights_zh:
  - "<strong>视频数据伪造合成：</strong>主导合成链路三轮演进：(1) 将硬编码固定 workflow 重构为标准化工具链并扩展伪造类型；(2) 升级为固定编排的 Agent 系统，以工具调用 + Agent 评估实现多种伪造形态自由组合；(3) 演进为 <strong>agentic harness</strong>，让 Agent 从人工反馈样本中学习新伪造方式并沉淀为可复用 skill，突破预设形态边界、持续覆盖长尾伪造形态。合成数据对现有系统欺骗成功率由 <strong>13%</strong> 提升至 <strong>48%</strong>。"
  - "<strong>长视频分层理解：</strong>针对小时级视频远超 MLLM 上下文窗口、直接推理信息稀释严重的问题，构建感知—分析—决策多 Agent 架构，将分割、追踪、时序取证封装为工具并经 Function Calling / MCP 调度，以全局摘要—候选段召回—段内精定位分层推理，实现小时级视频逐段定位与可追溯证据链，时序定位 IoU 由 <strong>54%</strong> 提升至 <strong>72%</strong>。"

- title: "Reliable Inference & Guarantees for On-Device MLLMs"
  title_zh: "端侧多模态大模型的可靠推理与保证研究"
  role: Research Lead
  role_zh: 研究负责人
  date: Oct. 2025 - Aug. 2026
  date_zh: 2025.10 - 2026.08
  tags: [Contrastive Decoding, Bayes Risk, Conformal Prediction, MLLM]
  tech_stack: [Contrastive Decoding, Bayes Risk Minimization, Conformal Risk Control, Transformers]
  highlights:
  - "<strong>SECD</strong> — When visual evidence is thin, MLLMs fall back on language priors and produce well-formatted but numerically wrong timestamps. SECD isolates the numeric token subspace and aggregates layer-wise references via renormalized entropy, confining contrastive calibration to boundary-deciding tokens. Training-free, plug-and-play; up to <strong>+5.0</strong> R@0.7 across five VTG benchmarks. <strong>ACM MM 2026</strong> (CCF-A)."
  - "<strong>NuMD</strong> — Greedy decoding collapses the model's implicit interval distribution to a point estimate, which is suboptimal under IoU metrics. NuMD estimates the marginal via constrained sampling with importance correction and minimizes Bayes risk to approach the Bayes-optimal prediction. Training-free; mIoU up to <strong>+5.4</strong> on five benchmarks. Submitted to <strong>AAAI 2027</strong>."
  - "<strong>Conformal temporal grounding</strong> — MLLM timestamps come with no calibration: high confidence ≠ low error. We formalize this as a risk-control problem — sample timestamps repeatedly per query, estimate per-boundary expansion difficulty, and calibrate via <strong>conformal risk control</strong> for distribution-free, finite-sample guarantees. At α=0.1, empirical risk stays in <strong>0.09–0.11</strong> across 16 model configs. Submitted to <strong>AAAI 2027</strong>."
  highlights_zh:
  - "<strong>时序幻觉抑制 (SECD)：</strong>针对 MLLM 在视觉证据不足时退化为语言先验产生时序幻觉的问题，提出<strong>子空间熵对比解码 (SECD)</strong>，动态隔离数值子空间并以多中间层重归一化熵聚合层级参考分布，将对比校准限定于决定时序边界的数值 token；训练无关、即插即用，5 个 VTG 基准 R@0.7 最高 <strong>+5.0</strong>。录用于 <strong>ACM MM 2026</strong>（CCF-A）。"
  - "<strong>数值精度优化 (NuMD)：</strong>针对贪心解码将隐含时间区间分布坍缩为单点估计的问题，提出<strong>数值边际解码框架 (NuMD)</strong>，以约束采样限定合法数值路径、重要性修正估计边际分布，最小化贝叶斯风险逼近贝叶斯最优预测；训练无关，5 个基准一致优于贪心解码，mIoU 最高 <strong>+5.4</strong>。投稿 <strong>AAAI 2027</strong>。"
  - "<strong>预测可靠性保证：</strong>将可靠时序定位形式化为风险控制问题，以同一查询多次采样的时间戳分布估计各边界外扩难度，经<strong>共形风险控制</strong>在校准集上标定，使期望漏检风险不超预设水平，提供无分布假设、有限样本保证；目标风险 α=0.1 下经验风险严控于 <strong>0.09–0.11</strong>，跨 16 个模型配置全部达标。投稿 <strong>AAAI 2027</strong>。"

- title: Intelligent Road Damage Recognition and Application
  title_zh: 道路路面病害智能识别技术研究与应用
  org: Chongqing Municipal Key Project (university–industry collaboration)
  org_zh: 重庆市专项重点项目（校企联合）
  role: Core Member
  role_zh: 核心成员
  date: Dec. 2022 - Dec. 2025
  date_zh: 2022.12 - 2025.12
  logo: /assets/images/badges/CQU.png
  tags: [Object Detection, Data Augmentation, Data Platform]
  tech_stack: [YOLO, Label Studio, PEFT, Copy-Paste / Mix-Up]
  highlights:
  - Extended <a href="https://github.com/HumanSignal/label-studio/" target="_blank">Label Studio</a> into a data management platform with cleaning, augmentation, model-assisted pre-annotation, and verification. Processed ~600K expressway images.
  - Set up a pre-annotate → human-correct → retrain loop that brought pre-annotation usability to 95% over 100K+ records.
  - Fine-tuned YOLO with Copy-Paste and Mix-Up augmentation, cutting the miss rate on long-tail defect types below 0.5%. Also plugged in a local Qwen3 model to auto-generate inspection reports with distress maps, statistics, and analyses. Shipped to production.
  highlights_zh:
  - 基于 <a href="https://github.com/HumanSignal/label-studio/" target="_blank">Label Studio</a> 二次开发数据平台，覆盖清洗、增强、模型辅助标注与核验，处理约 60 万张快速路图像数据。
  - 构建自定义模型预标注—人工修正—重训练闭环，预标注可用率提升至 95%，累计处理超 10 万条标注数据。
  - 集成 Copy-Paste、Mix-Up 等数据增强策略，微调 YOLO 检测模型，实现长尾病害漏检率 &lt;0.5%；本地接入 Qwen3 模型，设计自动化巡检报告生成方案，可输出病害分布图、统计表格与分析报告。已交付使用。

