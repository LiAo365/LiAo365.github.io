short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Ph.D. candidate in Software Engineering at
    <a href="https://www.cqu.edu.cn/" target="_blank">Chongqing University</a>,
    advised by <a href="https://www.cse.cqu.edu.cn/info/2165/8486.htm" target="_blank">Prof. Yongxin Ge</a>.
    My research centers on three directions: <strong>efficient MLLM inference</strong>
    (hallucination suppression, reliability measurement and guarantees, training-free & plug-and-play methods),
    <strong>long-video temporal understanding</strong> (temporal grounding and moment retrieval), and
    <strong>multimodal agents</strong> (agentic harness design, tool-use and multi-role orchestration for hour-long video understanding).
  </p>
  <p>
    I am currently a CSC-funded visiting researcher at
    <a href="https://www.a-star.edu.sg/" target="_blank">A*STAR Singapore</a> (CFAR Group),
    working with <a href="https://joeyzhouty.github.io/" target="_blank">Prof. Joey Tianyi Zhou</a>
    on efficient & agentic MLLM inference and on-device MLLM reliability.
  </p>
  <p>
    I have published 2 first-author CCF-A papers at ACM MM and 1 JCR Q1 journal paper at IEEE TCSVT.
  </p>
  <div class="callout-hire-me">
    <i class="fas fa-paper-plane"></i>
    I am currently looking for <strong>internship or full-time algorithm/research engineer</strong> opportunities.
    Feel free to reach out if you think we might be a good fit!
  </div>

short_bio_zh: >-
  <p>
    我是<a href="https://www.cqu.edu.cn/" target="_blank">重庆大学</a>软件工程专业博士研究生，
    师从<a href="https://www.cse.cqu.edu.cn/info/2165/8486.htm" target="_blank">葛永新教授</a>。
    主要研究方向为：<strong>高效多模态大模型推理</strong>（幻觉抑制、可靠性度量与保证、训练无关即插即用方法）、
    <strong>长视频时序理解</strong>（视频时序定位与时刻检索），以及<strong>多模态 Agent</strong>
    （agentic harness 设计、面向小时级视频理解的工具调用与多角色协同编排）。
  </p>
  <p>
    目前在<a href="https://www.a-star.edu.sg/" target="_blank">新加坡科技研究局（A*STAR）</a> CFAR Group
    进行国家公派联合培养，导师为
    <a href="https://joeyzhouty.github.io/" target="_blank">Prof. Joey Tianyi Zhou</a>，
    研究内容为多模态大模型的高效推理及 Agentic 应用落地、端侧 MLLM 可靠性度量。
  </p>
  <p>
    已发表 2 篇 CCF-A 类会议论文（ACM MM，一作）与 1 篇中科院一区期刊论文（IEEE TCSVT，一作）。
  </p>
  <div class="callout-hire-me">
    <i class="fas fa-paper-plane"></i>
    目前正在寻找<strong>算法/研究工程师方向的实习或全职</strong>机会，欢迎联系交流！
  </div>

