# Shown on the "More" page.
skills:
- name: Fine-tuning & Deployment
  items: Proficient with PyTorch, Transformers, PEFT (LoRA); vLLM inference deployment and acceleration; familiar with mainstream multimodal LLM architectures such as Qwen-VL.
- name: Multimodal & Agents
  items: MLLM inference optimization; multi-agent orchestration and agentic-harness design with LangGraph; Function Calling / MCP tool-chains; Context Engineering.
- name: Computer Vision
  items: Video temporal grounding, weakly-supervised temporal action localization, object detection; data augmentation, large-scale automated annotation, and synthesis.
- name: HPC & Engineering
  items: Python, C/C++, Java; custom operator development on Ascend/CANN; Linux, Git, Docker; working knowledge of network protocols, databases, and OS fundamentals.

skills_zh:
- name: 模型微调与部署
  items: 熟悉 PyTorch / Transformers / PEFT (LoRA) 微调；vLLM 推理部署；Qwen 等主流多模态大模型架构。
- name: 多模态与 Agent
  items: 了解 LangGraph 多 Agent 编排、agentic harness；Function Calling / MCP；Context Engineering。
- name: 计算机视觉
  items: 熟悉视频时序定位、弱监督时序动作定位、目标检测；数据增广、数据自动化标注与合成。
- name: 高性能与工程
  items: Python、C/C++、Java；Linux、Git、Docker；了解常用网络协议、数据库与操作系统基本原理。

