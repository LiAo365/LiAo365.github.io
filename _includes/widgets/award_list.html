{%- comment -%}
  Usage: {% include widgets/award_list.html items=site.data.profile.awards %}
{%- endcomment -%}
<ul class="list small pl-3 mb-1">
    {% for item in include.items %}
    <li>
        <div class="d-flex">
            <div>{{ item.name }}</div>
            <div class="ml-auto mt-auto pl-2 no-break text-muted"><em>{{ item.date }}</em></div>
        </div>
    </li>
    {% endfor %}
</ul>
